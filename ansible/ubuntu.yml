- name: setup local machine
  hosts: localhost
  connection: local
  vars:
    # Ubuntu 26.04 replaces the default sudo with sudo-rs, so use the legacy sudo.ws binary for become.
    ansible_become_exe: "{{ 'sudo.ws' if (ansible_distribution == 'Ubuntu' and ansible_distribution_version == '26.04') else 'sudo' }}"
  vars_prompt:
    - name: prompt_aws
      prompt: Is target environment AWS? [y/N]
      private: false
    - name: prompt_wsl
      prompt: Is target environment WSL? [y/N]
      private: false
    - name: prompt_desktop
      prompt: Is target environment is desktop(GUI)? [y/N]
      private: false
    - name: prompt_container
      prompt: Set up Container Environment? [y/N]
      private: false
    - name: prompt_robotics
      prompt: Set up robotics development tools? [y/N]
      private: false
  roles:
    - role: japanese
    - role: wsl
      when: prompt_wsl == 'y'
    - role: dotfiles
    - role: system
    - role: desktop
      when: prompt_desktop == 'y'
    - role: container
      when: prompt_container == 'y'
    - role: ros
      when: prompt_robotics == 'y'
