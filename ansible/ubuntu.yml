- name: setup local machine
  hosts: localhost
  connection: local
  vars:
    # Ubuntu 26.04+ replaces the default sudo with sudo-rs, so use the legacy sudo.ws binary for become.
    # NOTE: ansible_distribution/ansible_distribution_version cannot be used here because become_exe
    # is resolved before facts are gathered, causing "'ansible_distribution' is undefined".
    ansible_become_exe: "{{ 'sudo.ws' if (lookup('ansible.builtin.pipe', 'command -v sudo.ws 2>/dev/null || true') != '') else 'sudo' }}"
  vars_prompt:
    - name: prompt_aws
      prompt: Is target environment AWS? [y/N]
      private: false
    - name: prompt_desktop
      prompt: Is target environment is desktop(GUI)? [y/N]
      private: false
    - name: prompt_robotics
      prompt: Set up robotics development tools? [y/N]
      private: false
  pre_tasks:
    - name: check whether running under WSL
      ansible.builtin.stat:
        path: /run/WSL
      register: wsl_run_dir
    - name: set is_wsl fact
      ansible.builtin.set_fact:
        is_wsl: "{{ wsl_run_dir.stat.exists }}"
  roles:
    - role: japanese
    - role: wsl
      when: is_wsl
    - role: dotfiles
    - role: system
    - role: desktop
      when: prompt_desktop == 'y'
    - role: container
      when: not is_wsl
    - role: ros
      when: prompt_robotics == 'y'
