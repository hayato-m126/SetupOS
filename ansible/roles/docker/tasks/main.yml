- name: install docker build dependencies
  become: true
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    update_cache: true

- name: ensure apt keyrings directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: download docker keyring
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: true

- name: remove stale docker keyring
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    state: absent

# apt_repository does not overwrite the file, causing duplicate/conflicting Signed-By entries on re-run
- name: add docker repository
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
    content: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable\n"
    mode: "0644"

- name: install docker
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      - pciutils # for lspci
    update_cache: true

- name: add {{ ansible_facts['user_id'] }} to docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true

- name: Check if NVIDIA GPU is present
  ansible.builtin.shell: lspci | grep -i nvidia
  register: nvidia_gpu_check
  failed_when: false
  changed_when: false

- name: Install NVIDIA Container Toolkit if NVIDIA GPU is present
  import_tasks: nvidia_container_toolkit.yml
  when: nvidia_gpu_check.rc == 0
