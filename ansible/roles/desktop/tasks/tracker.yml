- name: install dependency
  become: true
  ansible.builtin.apt:
    name:
      - libxcb-cursor0 # activitywatch dependency
    update_cache: true

- name: download activitywatch deb
  ansible.builtin.get_url:
    url: https://github.com/ActivityWatch/activitywatch/releases/download/v0.13.2/activitywatch-v0.13.2-linux-x86_64.deb
    dest: /tmp/activitywatch.deb

- name: install activitywatch deb package
  become: true
  ansible.builtin.apt:
    deb: /tmp/activitywatch.deb
