- name: use English folder name
  ansible.builtin.shell: LANG=C xdg-user-dirs-update --force

- name: install desktop tools using apt
  become: true
  ansible.builtin.apt:
    name:
      - dconf-editor
      - gedit
      - gparted
      - hardinfo
      - libfuse2 # https://syohex.hatenablog.com/entry/2022/05/02/230822
      - meld
      - zstd
    update_cache: true

- name: install desktop tools (non-AWS) using apt
  become: true
  ansible.builtin.apt:
    name:
      - exfatprogs
      - thunderbird-locale-ja
      - winbind
    update_cache: true
  when: prompt_aws != 'y'

- name: install ghostty using snap
  become: true
  community.general.snap:
    name: ghostty
    state: present
    classic: true

- name: download grub-customizer keyring
  become: true
  ansible.builtin.shell: |
    curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&exact=on&search=0x7EDB2B9AEE0757D787DFFC2014BEBC7363BDC51E" | gpg --dearmor -o /usr/share/keyrings/grub-customizer-keyring.gpg
  args:
    creates: /usr/share/keyrings/grub-customizer-keyring.gpg
  when:
    - prompt_aws != 'y'
    - ansible_facts['architecture'] == 'x86_64'

- name: add grub-customizer ppa
  become: true
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/usr/share/keyrings/grub-customizer-keyring.gpg] https://ppa.launchpadcontent.net/danielrichter2007/grub-customizer/ubuntu {{ ansible_facts['distribution_release'] }} main
    filename: grub-customizer
    state: present
  when:
    - prompt_aws != 'y'
    - ansible_facts['architecture'] == 'x86_64'

- name: install grub-customizer
  become: true
  ansible.builtin.apt:
    name: grub-customizer
    update_cache: true
  when:
    - prompt_aws != 'y'
    - ansible_facts['architecture'] == 'x86_64'

- name: disable sleep when close note pc display
  become: true
  ansible.builtin.lineinfile:
    path: /etc/systemd/logind.conf
    line: HandleLidSwitch=ignore
    insertafter: EOF
  when: prompt_aws != 'y'

- name: set clock local for Windows dual boot system
  become: true
  community.general.timezone:
    name: Asia/Tokyo
    hwclock: local
  when: prompt_aws != 'y'

- name: setting for winbind
  become: true
  ansible.builtin.replace:
    path: /etc/nsswitch.conf
    regexp: " dns$"
    replace: " dns wins"
  when: prompt_aws != 'y'

- name: install gear lever
  become: true
  community.general.flatpak:
    name: it.mijorus.gearlever
    state: present
  when: prompt_aws != 'y'

- import_tasks: browser.yml

- import_tasks: multimedia.yml
  when:
    - prompt_aws != 'y'
    - ansible_facts['architecture'] == 'x86_64'

- import_tasks: vscode.yml
- import_tasks: tracker.yml
