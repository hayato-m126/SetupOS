- name: install mise
  ansible.builtin.shell: curl https://mise.jdx.dev/install.sh | sh
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"

- name: install system tools using apt
  become: true
  ansible.builtin.apt:
    name:
      - git-lfs
      - htop
      - net-tools
      - ncdu
      - tree
      - gnome-shell-extension-manager
      - gawk
      - make
    update_cache: true

- name: install ble.sh
  ansible.builtin.shell: |
    set -e
    tmpdir=$(mktemp -d)
    git clone --recursive --depth 1 --shallow-submodules https://github.com/akinomyoga/ble.sh.git "$tmpdir"
    make -C "$tmpdir" install PREFIX="{{ ansible_facts['env']['HOME'] }}/.local"
    rm -rf "$tmpdir"
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/share/blesh/ble.sh"

- name: install system tools (non-AWS) using apt
  become: true
  ansible.builtin.apt:
    name:
      - flatpak
      - gnome-software-plugin-flatpak
    update_cache: true

- name: Add Flathub remote
  become: true
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
